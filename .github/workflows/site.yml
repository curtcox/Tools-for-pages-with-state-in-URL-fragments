name: Docs and demo Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: docs-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      kit-path: demo/vendor/fragment-kit-v0.2.0
      contract-config: demo/contract.config.mjs
      base-url: http://127.0.0.1:8000/demo/
      server-command: node tools/serve.mjs
      browser-command: ''
      gallery-command: ''
  deploy:
    needs: test
    uses: ./.github/workflows/pages.yml
    with:
      stage-command: node tools/stage.mjs
      path: _site
      verify-marker: fragment-kit-site-v1
